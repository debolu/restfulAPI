
name: Run Postman API Collection

on:
  push:
    branches:
      - main  # Adjust to your main branch name
  workflow_dispatch:  # Allows manual trigger of the workflow

jobs:
  run-newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Updated to the latest version

      - name: Set up Node.js
        uses: actions/setup-node@v3  # Updated to the latest version
        with:
          node-version: '16'  # Specify the Node.js version

      - name: Install Newman and HTMLExtra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra  # Ensure htmlextra reporter is installed

      - name: Run Postman Collection
        env:
          api_Key: 44e75bcd-d601-4361-8b6f-f40bcd342ae7
          baseURL: https://api.restful-api.dev
        run: |
          mkdir -p ./reports
          newman run restful-api.dev_Newman.postman_collection.json -r htmlextra --reporter-htmlextra-export ./reports/report.html --verbose

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4  # Updated to the latest version
        with:
          name: newman-report
          path: ./reports/report.html
